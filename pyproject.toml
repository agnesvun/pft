[project]
name = "pft"
version = "0.1.0"
description = "personal finance tracker"
readme = "README.md"
authors = [
    { name = "agnesvun", email = "yhvuna@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
pft = "pft.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
